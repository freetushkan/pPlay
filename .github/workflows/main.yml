name: ps4-release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ps4:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pacman-package-manager wget cmake git gettext smpq \
            makepkg libarchive-tools build-essential \
            autoconf libtool nasm curl

          sudo tee -a /etc/pacman.conf > /dev/null <<TEXT
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          TEXT

          git clone --depth 1 https://github.com/PacBrew/ps4-openorbis-portlibs.git /tmp/portlibs

      - name: Setup pacman packages
        run: |
          sudo pacman --noconfirm -Sy
          sudo pacman --noconfirm -S --needed \
            ps4-openorbis ps4-openorbis-portlibs

          # Fix missing header
          sudo mkdir -p /opt/pacbrew/ps4/openorbis/include/sys
          echo '#include <endian.h>' | sudo tee /opt/pacbrew/ps4/openorbis/include/sys/endian.h > /dev/null

      - name: Cache for recompiled PS4 Portlibs
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: /opt/compiled_libs
          key: ${{ runner.os }}-ps4-libs-openssl-v1

      - name: Rebuild OpenSSL for PS4
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          cd ps4-openssl
          ./Configure --prefix=/opt/pacbrew/ps4/openorbis/usr ps4-cross
          make -j"$(nproc)"
          sudo make install
          find /opt -name openssl.pc

      - name: Rebuild curl with OpenSSL
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p /opt/compiled_libs/curl
          cd /tmp/portlibs/libcurl
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          sed -i "s/'ps4-openorbis-mbedtls'//g" PKGBUILD
          sed -i 's/--with-mbedtls/--with-openssl/g' PKGBUILD
          grep -q -- "--with-openssl" PKGBUILD
          makepkg --noconfirm --syncdeps --cleanbuild
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/curl/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Rebuild ffmpeg with OpenSSL and https
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p /opt/compiled_libs/ffmpeg
          cd /tmp/portlibs/ffmpeg
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          export PKG_CONFIG_PATH="/opt/pacbrew/ps4/openorbis/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export OPENSSL_PREFIX="/opt/pacbrew/ps4/openorbis/usr"
          sed -i '/^build() {/,/^}/d' PKGBUILD
          echo 'build() {' >> PKGBUILD
          echo '  cd ffmpeg-$pkgver' >> PKGBUILD
          echo '  source /opt/pacbrew/ps4/openorbis/ps4vars.sh' >> PKGBUILD
          echo '' >> PKGBUILD
          echo '  ./configure --prefix="${OPENORBIS}/usr" \' >> PKGBUILD
          echo '    --enable-cross-compile --cross-prefix=${OPENORBIS}/bin/ \' >> PKGBUILD
          echo '    --arch=x86_64 --target-os=freebsd \' >> PKGBUILD
          echo '    --disable-shared --enable-static --enable-nonfree \' >> PKGBUILD
          echo '    --pkg-config=openorbis-pkg-config \' >> PKGBUILD
          echo '    --disable-programs --disable-debug --disable-doc \' >> PKGBUILD
          echo '    --disable-avdevice --disable-hwaccels --disable-encoders --disable-muxers \' >> PKGBUILD
          echo '    --enable-swscale --enable-swresample --enable-network \' >> PKGBUILD
          echo '    --disable-protocols --enable-protocol=file,http,ftp,tcp,udp,rtmp,https \' >> PKGBUILD
          echo '    --enable-zlib --enable-bzlib --enable-libass --enable-libfreetype --enable-libfribidi \' >> PKGBUILD
          echo '    --enable-openssl \' >> PKGBUILD
          echo '    --enable-version3 \' >> PKGBUILD
          echo '    --extra-cflags="-I${OPENSSL_PREFIX}/include" \' >> PKGBUILD
          echo '    --extra-ldflags="-L${OPENSSL_PREFIX}/lib -lssl -lcrypto" \' >> PKGBUILD
          echo '    --openssl-ldflags="-lssl -lcrypto" \' >> PKGBUILD
          echo '    --cc=$CC --cxx=$CXX --nm=$NM --strip=$STRIP --ar=$AR --ranlib=$RANLIB' >> PKGBUILD
          echo '' >> PKGBUILD
          echo '  sed -i '\''s|#define HAVE_SYSCTL 1|//#define HAVE_SYSCTL 1|g'\'' config.h' >> PKGBUILD
          echo '  sed -i "s/HAVE_SSL_LIBRARY_INIT 1/HAVE_SSL_LIBRARY_INIT 0/g" config.h' >> PKGBUILD
          echo '' >> PKGBUILD
          echo '  make --quiet -j$(nproc)' >> PKGBUILD
          echo '}' >> PKGBUILD
          echo "=== Patched PKGBUILD ==="
          cat PKGBUILD
          makepkg --noconfirm --syncdeps --cleanbuild --log || {
            echo "=== Build failed. Showing logs ==="
            find . -name "*.log" -exec tail -n 150 {} +
            if [ -f ffmpeg-*/ffbuild/config.log ]; then
              echo "=== config.log (last 400 lines) ==="
              tail -n 400 ffmpeg-*/ffbuild/config.log
            fi
            exit 1
          }
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/ffmpeg/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Rebuild libmpv with updated ffmpeg
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p /opt/compiled_libs/libmpv
          cd /tmp/portlibs/libmpv
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          makepkg --noconfirm --syncdeps --cleanbuild
          ls -l ./
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/libmpv/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Install cached ffmpeg
        if: steps.cache-libs.outputs.cache-hit == 'true'
        run: |
          find /opt/compiled_libs/ffmpeg -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Install cached curl
        if: steps.cache-libs.outputs.cache-hit == 'true'
        run: |
          find /opt/compiled_libs/curl -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Install cached libmpv
        if: steps.cache-libs.outputs.cache-hit == 'true'
        run: |
          find /opt/compiled_libs/libmpv -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Configure pPlay
        run: |
          MAIN_CPP="src/main.cpp"
          IO_CPP="src/io.cpp"

          # libjbc
          if [ ! -d "src/libjbc" ]; then
            git clone https://github.com/sleirsgoevy/ps4-libjbc.git src/libjbc
          fi

          # FIX pid_t conflict
          sed -i 's/typedef uint32_t pid_t;/\/\/ typedef uint32_t pid_t;/g' src/libjbc/defs.h

          # Inject libjbc
          if ! grep -q "libjbc/jailbreak.c" CMakeLists.txt; then
            echo 'target_sources(pplay PRIVATE src/libjbc/jailbreak.c src/libjbc/kernelrw.c src/libjbc/utils.c)' >> CMakeLists.txt
            echo 'target_include_directories(pplay PRIVATE src)' >> CMakeLists.txt
          fi

          # Patch paths
          if [ -f "$IO_CPP" ]; then
            sed -i 's|return "/data/";|return "/mnt/disc/";|g' "$IO_CPP"
            sed -i 's|devices.push_back({"/data/", "DATA", DeviceType::HDD});|devices.push_back({"/mnt/disc/", "NAPED BD", DeviceType::USB});|g' "$IO_CPP"
          fi

          # Build
          rm -rf cmake-build
          mkdir -p pscrap && echo "test" > pscrap/tmdb.key

          mkdir -p cmake-build
          cd cmake-build

          export OPENORBIS=/opt/pacbrew/ps4/openorbis

          cmake -G "Unix Makefiles" \
            -DPLATFORM_PS4=ON \
            -DOPTION_SMB2=ON \
            -DCMAKE_BUILD_TYPE=Release ..

      - name: Build pplay
        run: |
          cd cmake-build
          make pplay_pkg -j$(nproc)
          mv *.pkg ../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pPlay-PS4-PKG
          path: "*.pkg"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: "*.pkg"

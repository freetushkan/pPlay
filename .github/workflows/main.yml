name: ps4-release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ps4:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pacman-package-manager wget cmake git gettext smpq \
            makepkg libarchive-tools build-essential \
            autoconf libtool nasm curl pkg-config

          sudo tee -a /etc/pacman.conf > /dev/null <<TEXT
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          TEXT

          git clone --depth 1 https://github.com/PacBrew/ps4-openorbis-portlibs.git /tmp/portlibs

      - name: Setup pacman packages
        run: |
          sudo pacman --noconfirm -Sy
          sudo pacman --noconfirm -S --needed \
            ps4-openorbis ps4-openorbis-portlibs

          # Fix missing header
          sudo mkdir -p /opt/pacbrew/ps4/openorbis/include/sys
          echo '#include <endian.h>' | sudo tee /opt/pacbrew/ps4/openorbis/include/sys/endian.h > /dev/null

      - name: Cache for recompiled PS4 Portlibs
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: /opt/compiled_libs
          key: ${{ runner.os }}-ps4-libs-v2

      - name: Build OpenSSL for PS4
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          cd ps4-openssl
          ./Configure --prefix=/opt/pacbrew/ps4/openorbis/usr ps4-cross no-tests no-shared
          find . -name "*.h" -exec sed -i 's/#define HAVE_GETENTROPY 1//g' {} +
          find . -name "*.h" -exec sed -i 's/#define HAVE_GETRANDOM 1//g' {} +
          sed -i 's/-DHAVE_GETENTROPY//g' Makefile
          sed -i 's/-DHAVE_GETRANDOM//g' Makefile
          make -j"$(nproc)"
          sudo make install
          find /opt -name openssl.pc
          mkdir -p /opt/compiled_libs/openssl
          cp -a /opt/pacbrew/ps4/openorbis/usr/include/openssl /opt/compiled_libs/openssl/ 2>/dev/null || true
          cp -a /opt/pacbrew/ps4/openorbis/usr/lib/libcrypto* /opt/compiled_libs/openssl/ 2>/dev/null || true
          cp -a /opt/pacbrew/ps4/openorbis/usr/lib/libssl* /opt/compiled_libs/openssl/ 2>/dev/null || true

      - name: Rebuild ffmpeg with mbedTLS and https
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p /opt/compiled_libs/ffmpeg
          cd /tmp/portlibs/ffmpeg
          sed -i "s/'ps4-openorbis-libfribidi' 'ps4-openorbis-freetype'/'ps4-openorbis-libfribidi' 'ps4-openorbis-freetype' 'ps4-openorbis-mbedtls'/" PKGBUILD
          sed -i 's/--enable-libfribidi/--enable-libfribidi --enable-version3 --enable-mbedtls/' PKGBUILD
          sed -i 's/--enable-protocol=file,http,ftp,tcp,udp,rtmp/--enable-protocol=file,http,ftp,tcp,udp,rtmp,https/' PKGBUILD
          grep -q 'ps4-openorbis-mbedtls' PKGBUILD
          grep -q 'enable-mbedtls' PKGBUILD
          grep -q 'udp,rtmp,https' PKGBUILD
          makepkg --noconfirm --syncdeps
          ls -l ./
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/ffmpeg/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Rebuild libmpv with updated ffmpeg
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p /opt/compiled_libs/libmpv
          cd /tmp/portlibs/libmpv
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          makepkg --noconfirm --syncdeps --cleanbuild
          ls -l ./
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/libmpv/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Install cached OpenSSL
        if: steps.cache-libs.outputs.cache-hit == 'true'
        run: |
          echo "Restoring OpenSSL from cache..."
          sudo cp -a /opt/compiled_libs/openssl/include/openssl /opt/pacbrew/ps4/openorbis/usr/include/ 2>/dev/null || true
          sudo cp -a /opt/compiled_libs/openssl/lib* /opt/pacbrew/ps4/openorbis/usr/lib/ 2>/dev/null || true

      - name: Install cached ffmpeg
        if: steps.cache-libs.outputs.cache-hit == 'true'
        run: |
          find /opt/compiled_libs/ffmpeg -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Install cached libmpv
        if: steps.cache-libs.outputs.cache-hit == 'true'
        run: |
          find /opt/compiled_libs/libmpv -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Build OpenScreen via GN
        run: |
          set -eux
          if [ ! -d "/opt/depot_tools" ]; then
            sudo mkdir -p /opt/depot_tools
            sudo chown -R $USER:$USER /opt/depot_tools
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot_tools
          fi
          export PATH="/opt/depot_tools:$PATH"
          echo "/opt/depot_tools" >> $GITHUB_PATH
          cd /opt/depot_tools && ./update_depot_tools
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          cd "$GITHUB_WORKSPACE" && rm -rf openscreen
          gclient config --spec='
          solutions = [
            {
              "name": "openscreen",
              "url": "https://chromium.googlesource.com/openscreen",
              "deps_file": "DEPS",
              "managed": False,
            },
          ]'
          gclient sync --no-history --shallow --force
          cd openscreen

          # Copy ps4-openssl BoringSSL
          cp -r "$GITHUB_WORKSPACE/ps4-openssl/boringssl/"* third_party/boringssl/

          # Create C++20 polyfills for PS4 cross-compiler
          mkdir -p "CXX20_polyfills"
          cat > "CXX20_polyfills/format" <<'POLYFILL'
            #pragma once
            #ifndef __FORMAT_POLYFILL_H__
            #define __FORMAT_POLYFILL_H__
            #include <string>
            #include <sstream>
            namespace std {
              template<typename... Args>
              struct format_string {
                std::string_view str;
                template<typename T>
                format_string(const T& s) : str(s) {}
              };
              template<typename... Args>
              inline std::string format(std::string_view fmt, Args&&...) {
                return std::string(fmt);
              }
              template<typename... Args>
              inline std::string format(const format_string<Args...>& fmt, Args&&...) {
                return std::string(fmt.str);
              }
            }
            #endif
          POLYFILL
          cat > "CXX20_polyfills/ranges" <<'POLYFILL'
            #pragma once
            #ifndef __RANGES_POLYFILL_H__
            #define __RANGES_POLYFILL_H__
            #include <vector>
            #include <iterator>
            #define constexpr_string_hack
            namespace std { namespace ranges { } }
            #endif
          POLYFILL

          # Clean string_util.h from CXX20 stuff
          UTIL_FILE="util/string_util.h"
          if [ -f "$UTIL_FILE" ]; then
            sed -i 's/constexpr std::string/std::string/g' "$UTIL_FILE"
            sed -i 's/template <std::ranges::input_range R>/template <typename R>/g' "$UTIL_FILE"
            sed -i 's/std::ranges::empty/std::empty/g' "$UTIL_FILE"
            sed -i 's/return Join(std::ranges::subrange{begin, end}, delimeter);/return Join<Iterator>(begin, end, delimeter);/g' "$UTIL_FILE"
            sed -i 's/ss << range.front();/bool is_first = true;/g' "$UTIL_FILE"
            sed -i 's/for (auto element : range | std::views::drop(1))/for (auto\&\& element : range) if (is_first) is_first = false; else/g' "$UTIL_FILE"
            sed -i 's/ss << delimeter << element;/ss << (is_first ? "" : delimeter) << element; is_first = false;/g' "$UTIL_FILE"
          fi
          PRINTF_FILE="util/string_printf.h"
          if [ -f "$PRINTF_FILE" ]; then
            sed -i 's/#include <format>/#include <cstdio>\n#include <memory>/g' "$PRINTF_FILE"
            sed -i 's/std::format_string<Args...> fmt/const std::string\& fmt/g' "$PRINTF_FILE"
            sed -i 's/return std::format(fmt, std::forward<Args>(args)...);/int sz = std::snprintf(nullptr, 0, fmt.c_str(), args...) + 1; std::unique_ptr<char[]> buf(new char[sz]); std::snprintf(buf.get(), sz, fmt.c_str(), args...); return std::string(buf.get(), buf.get() + sz - 1);/g' "$PRINTF_FILE"
          fi

          mkdir -p build/config
          echo "build_with_chromium = false" > build/config/gclient_args.gni

          # Install system dependencies for GN build
          sudo ./build/install-build-deps.py --no-prompt 2>/dev/null || true

          # Configure GN with PS4-specific settings and use ps4-openssl BoringSSL
          gn gen out/Default --args="
            is_debug=false 
            target_os=\"linux\" 
            treat_warnings_as_errors=false 
            is_component_build=false
            use_sysroot=false
            use_custom_libcxx=false
            cc=\"$CC\"
            cxx=\"$CXX\"
            ld=\"$LD\"
            ar=\"$AR\"
            ranlib=\"$RANLIB\"
            extra_cflags=\"-D__PS4__ -stdlib=libc++ -I/opt/pacbrew/ps4/openorbis/usr/include -I/opt/pacbrew/ps4/openorbis/include -I$GITHUB_WORKSPACE/ps4-openssl/boringssl/include\"
            extra_ldflags=\"-stdlib=libc++ -L/opt/pacbrew/ps4/openorbis/usr/lib -L/opt/pacbrew/ps4/openorbis/lib -L$GITHUB_WORKSPACE/ps4-openssl\"
          "

          echo "=== Verifying GN configuration ==="
          grep -E "^(cc|cxx|ar) =" out/Default/args.gn || echo "Note: args.gn not in expected format"
          cat out/Default/args.gn

          echo "=== Building OpenScreen components ==="
          autoninja -C out/Default cast_receiver platform util -k 0 || true  # gn_all

          echo "=== Building OpenScreen libs ==="
          ALL_OBJ_FILES=$(find out/Default/obj -name "*.o")
          "$AR" rcs out/Default/obj/cast/libcast_receiver.a $ALL_OBJ_FILES
          "$AR" rcs out/Default/obj/platform/libplatform.a $ALL_OBJ_FILES
          "$AR" rcs out/Default/obj/util/libutil.a $ALL_OBJ_FILES
          "$RANLIB" out/Default/obj/cast/libcast_receiver.a
          "$RANLIB" out/Default/obj/platform/libplatform.a
          "$RANLIB" out/Default/obj/util/libutil.a
          "$RANLIB" out/Default/obj/third_party/protobuf/libprotobuf_lite.a 

          echo "=== Checking build flags ==="
          grep -r "__PS4__" out/Default/obj 2>/dev/null | head -5 || echo "Warning: __PS4__ not found in build artifacts"

          echo "=== Verify generated files exist ==="
          for f in \
            cast_channel.pb.h runtime_version.h optimization.h value.h \
            libcast_receiver.a libplatform.a libutil.a libprotobuf_lite.a \
            logging_posix.cc build_config.h
          do 
            res=$(find . -name "$f")
            [ -n "$res" ] && echo "$res" || echo "Warning: $f not found"
          done

      - name: Configure pPlay
        run: |
          MAIN_CPP="src/main.cpp"
          IO_CPP="src/io.cpp"

          # libjbc
          if [ ! -d "src/libjbc" ]; then
            git clone https://github.com/sleirsgoevy/ps4-libjbc.git src/libjbc
          fi

          # FIX pid_t conflict
          sed -i 's/typedef uint32_t pid_t;/\/\/ typedef uint32_t pid_t;/g' src/libjbc/defs.h

          # Inject libjbc
          if ! grep -q "libjbc/jailbreak.c" CMakeLists.txt; then
            echo 'target_sources(pplay PRIVATE src/libjbc/jailbreak.c src/libjbc/kernelrw.c src/libjbc/utils.c)' >> CMakeLists.txt
            echo 'target_include_directories(pplay PRIVATE src)' >> CMakeLists.txt
          fi

          # Patch paths
          if [ -f "$IO_CPP" ]; then
            sed -i 's|return "/data/";|return "/mnt/disc/";|g' "$IO_CPP"
            sed -i 's|devices.push_back({"/data/", "DATA", DeviceType::HDD});|devices.push_back({"/mnt/disc/", "NAPED BD", DeviceType::USB});|g' "$IO_CPP"
          fi

          # Build
          rm -rf cmake-build
          mkdir -p pscrap && echo "test" > pscrap/tmdb.key

          mkdir -p cmake-build
          cd cmake-build

          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          export OPENORBIS=/opt/pacbrew/ps4/openorbis

          cmake -G "Unix Makefiles" \
            -DPLATFORM_PS4=ON \
            -DOPTION_SMB2=ON \
            -DOPENSCREEN_ROOT="${GITHUB_WORKSPACE}/openscreen" \
            -DOPENORBIS_ROOT="/opt/pacbrew/ps4/openorbis" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_AR="${AR}" ..

      - name: Build pplay
        run: |
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          cd cmake-build
          make pplay_pkg -j$(nproc)
          mv *.pkg ../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pPlay-PS4-PKG
          path: "*.pkg"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: "*.pkg"

name: pplay-release

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  release:
    types: [published]

defaults:
  run:
    shell: bash

permissions:
  contents: write

env:
  # Stable pPlay/master builds (including releases targeting master) keep this reviewed core SHA.
  # Every other source branch resolves P2Play/master once per workflow run below.
  P2PLAY_CORE_REPOSITORY: https://github.com/freetushkan/P2Play.git
  P2PLAY_CORE_MASTER_SHA: 1f30ceebd253cd4a71e3b978fcf0e8b70ac1f3dd
  P2PLAY_BOOST_VERSION: "1.86.0"
  P2PLAY_BOOST_INCLUDE_DIR: .cache/p2play-boost-headers

jobs:
  resolve-p2play:
    name: Get P2Play revision
    runs-on: ubuntu-latest
    outputs:
      core_sha: ${{ steps.resolve.outputs.core_sha }}
      core_source: ${{ steps.resolve.outputs.core_source }}
    steps:
      - name: Select one immutable P2Play revision for this run
        id: resolve
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.event.release.target_commitish || github.ref_name }}
        run: |
          set -euo pipefail

          # PRs use the source branch (github.head_ref), not the synthetic refs/pull/... ref.
          # Only builds explicitly sourced from pPlay/master use the stable lock.
          if [[ "$SOURCE_BRANCH" == "master" ]]; then
            CORE_SHA="$P2PLAY_CORE_MASTER_SHA"
            CORE_SOURCE="pPlay/master lock"
          elif [[ "$SOURCE_BRANCH" == "feature/p2play-https-poster-fetch" ]]; then
            CORE_SHA="c18541de7e7092c3603387d47906ed3d95e86f13"
            CORE_SOURCE="P2Play PR #45 native HTTPS callback"
          else
            CORE_SHA="$(git ls-remote --exit-code "$P2PLAY_CORE_REPOSITORY" refs/heads/master | awk 'NR == 1 {print $1}')"
            CORE_SOURCE="latest P2Play/master"
          fi

          if [[ ! "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve a full 40-character P2Play commit SHA: $CORE_SHA" >&2
            exit 1
          fi

          {
            echo "core_sha=$CORE_SHA"
            echo "core_source=$CORE_SOURCE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Embedded P2Play core"
            echo "- Selection: $CORE_SOURCE"
            echo "- Repository: $P2PLAY_CORE_REPOSITORY"
            printf '%s\n' "- Immutable SHA: $CORE_SHA" >> "$GITHUB_STEP_SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

  switch:
    needs: resolve-p2play
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    env:
      P2PLAY_CORE_SHA: ${{ needs.resolve-p2play.outputs.core_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt -yq update || true
          sudo apt -yq install git build-essential cmake curl git file patch

          git clone -b switch https://github.com/freetushkan/libsmb2.git
          git clone --depth 1 https://github.com/freetushkan/pacman-packages /tmp/pacman-packages
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder /tmp/pacman-packages

          # Install system and devkitPro dependencies
          sudo apt -yq update || true
          sudo apt -yq install git build-essential cmake curl meson ninja-build nasm fakeroot zstd patch

          # sudo dkp-pacman -S --noconfirm switch-lwext4 switch-ntfs-3g

      - name: Cache for build dependencies
        id: switch-cache
        uses: actions/cache@v6
        with:
          path: /opt/compiled_libs
          key: switch-v3

      - name: Build libusbhsfs
        if: steps.switch-cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          set -eux
          mkdir -p /opt/compiled_libs/libusbhsfs
          chown -R builder:builder /opt/compiled_libs
          cd /tmp/pacman-packages/switch/libusbhsfs
          su builder -c "dkp-makepkg --noconfirm --syncdeps --cleanbuild"
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/libusbhsfs/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo dkp-pacman --noconfirm -U {} \;

      - name: Build FFmpeg
        if: steps.switch-cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          set -eux
          mkdir -p /opt/compiled_libs/ffmpeg
          chown -R builder:builder /opt/compiled_libs
          cd /tmp/pacman-packages/switch/ffmpeg
          su builder -c "dkp-makepkg --noconfirm --syncdeps"
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/ffmpeg/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo dkp-pacman --noconfirm -U {} \;

      - name: Build libmpv
        if: steps.switch-cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          set -eux
          mkdir -p /opt/compiled_libs/libmpv
          chown -R builder:builder /opt/compiled_libs
          cd /tmp/pacman-packages/switch/libmpv
          su builder -c "dkp-makepkg --noconfirm --syncdeps --cleanbuild"
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/libmpv/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo dkp-pacman --noconfirm -U {} \;

      - name: Install cached libs
        if: steps.switch-cache.outputs.cache-hit == 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          find /opt/compiled_libs/ffmpeg -name "*.pkg.tar.*" -exec sudo dkp-pacman --noconfirm -U {} \;
          find /opt/compiled_libs/libmpv -name "*.pkg.tar.*" -exec sudo dkp-pacman --noconfirm -U {} \;
          find /opt/compiled_libs/libusbhsfs -name "*.pkg.tar.*" -exec sudo dkp-pacman --noconfirm -U {} \;

      - name: Cache embedded P2Play Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.P2PLAY_BOOST_INCLUDE_DIR }}
          key: p2play-boost-${{ env.P2PLAY_BOOST_VERSION }}-${{ needs.resolve-p2play.outputs.core_sha }}-v1
      - name: Prepare embedded P2Play core
        run: ci/prepare-p2play-embedded.sh

      - name: Configure pPlay
        run: |
          exec > >(tee -a job.log) 2>&1
          rm -rf cmake-build
          mkdir -p cmake-build && cd cmake-build
          cmake -G "Unix Makefiles" \
            -DPLATFORM_SWITCH=ON \
            -DOPTION_SMB2=ON \
            -DP2PLAY_EMBEDDED_SOURCE_DIR="$P2PLAY_EMBEDDED_SOURCE_DIR" \
            -DP2PLAY_EMBEDDED_BOOST_INCLUDE_DIR="$P2PLAY_EMBEDDED_BOOST_INCLUDE_DIR" \
            -DCMAKE_CXX_FLAGS="-D_GNU_SOURCE=1" \
            -DCMAKE_C_FLAGS="-D_GNU_SOURCE=1" \
            -DCMAKE_BUILD_TYPE=Release ..

      - name: Build pPlay
        run: |
          exec > >(tee -a job.log) 2>&1
          cd cmake-build
          # Keep an unstripped ELF for crash.log address resolution.
          make pplay -j$(nproc) VERBOSE=1
          cp pplay pplay.debug
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-readelf -S pplay.debug | grep -q '\.debug_info'
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip --strip-debug pplay
          make pplay_switch_release -j$(nproc) VERBOSE=1 --trace

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-Symbols-Switch
          path: "cmake-build/pplay.debug"
          retention-days: 90

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-Switch
          path: "cmake-build/release/*"

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "pPlay Switch" job.log
  ps4:
    needs: resolve-p2play
    runs-on: ubuntu-24.04
    env:
      P2PLAY_CORE_SHA: ${{ needs.resolve-p2play.outputs.core_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt-get update || true
          sudo apt-get install -y \
            pacman-package-manager wget cmake git gettext smpq \
            makepkg libarchive-tools build-essential autoconf \
            libtool nasm curl python3-pip libfast-float-dev \
            alien rpm debhelper patch
          pip3 install meson glad2 --break-system-packages

          sudo tee -a /etc/pacman.conf > /dev/null <<TEXT
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          TEXT

          git clone -b ps4-new https://github.com/freetushkan/libsmb2.git
          git clone --depth 1 https://github.com/freetushkan/ps4-openorbis-portlibs.git /tmp/portlibs

          # Setup pacman packages
          sudo pacman --noconfirm -Sy
          sudo pacman --noconfirm -S --needed \
            ps4-openorbis ps4-openorbis-portlibs

          # Fix missing header
          sudo mkdir -p /opt/pacbrew/ps4/openorbis/include/sys
          echo '#include <endian.h>' | sudo tee /opt/pacbrew/ps4/openorbis/include/sys/endian.h > /dev/null


      - name: Cache for build dependencies
        id: ps4-cache
        uses: actions/cache@v6
        with:
          path: /opt/compiled_libs
          key: ps4-v5

      - name: Build FFmpeg
        if: steps.ps4-cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          set -eux
          mkdir -p /opt/compiled_libs/ffmpeg
          cd /tmp/portlibs/ffmpeg
          makepkg --noconfirm --syncdeps
          ls -l ./
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/ffmpeg/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Build libmpv
        if: steps.ps4-cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          set -eux
          mkdir -p /opt/compiled_libs/libmpv

          if wget -q https://waf.io/waf-2.0.25 -O /tmp/waf && python3 /tmp/waf --version; then
            sudo install -m 755 /tmp/waf /usr/local/bin/waf
          else
            for mirror in https://rpmfind.net/linux/mageia https://mirrors.kernel.org/mageia; do
              wget -q "$mirror/distrib/9/x86_64/media/core/release/waf-2.0.25-1.mga9.noarch.rpm" -O /tmp/waf.rpm && break
            done
            (cd /tmp && sudo alien --to-deb --scripts /tmp/waf.rpm && sudo dpkg -i waf_*.deb) || echo "waf: not installed"
          fi

          cd /tmp/portlibs/libmpv
          makepkg --noconfirm --syncdeps --cleanbuild
          ls -l ./
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/libmpv/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Install cached libs
        if: steps.ps4-cache.outputs.cache-hit == 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          find /opt/compiled_libs/ffmpeg -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;
          find /opt/compiled_libs/libmpv -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Cache embedded P2Play Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.P2PLAY_BOOST_INCLUDE_DIR }}
          key: p2play-boost-${{ env.P2PLAY_BOOST_VERSION }}-${{ needs.resolve-p2play.outputs.core_sha }}-v1
      - name: Prepare embedded P2Play core
        run: ci/prepare-p2play-embedded.sh

      - name: Configure pPlay
        run: |
          exec > >(tee -a job.log) 2>&1
          # libjbc (only used with -DOPTION_PS4_JAILBREAK=ON) and FIX pid_t conflict
          if [ ! -d "src/libjbc" ]; then
            git clone https://github.com/freetushkan/ps4-libjbc.git src/libjbc
          fi
          sed -i 's/typedef uint32_t pid_t;/\/\/ typedef uint32_t pid_t;/g' src/libjbc/defs.h

          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          rm -rf cmake-build
          mkdir -p cmake-build
          cd cmake-build

          cmake -G "Unix Makefiles" \
            -DPLATFORM_PS4=ON \
            -DOPTION_SMB2=ON \
            -DP2PLAY_EMBEDDED_SOURCE_DIR="$P2PLAY_EMBEDDED_SOURCE_DIR" \
            -DP2PLAY_EMBEDDED_BOOST_INCLUDE_DIR="$P2PLAY_EMBEDDED_BOOST_INCLUDE_DIR" \
            -DCMAKE_BUILD_TYPE=Release ..

      - name: Build pPlay
        run: |
          exec > >(tee -a job.log) 2>&1
          cd cmake-build
          make pplay_ps4_release -j$(nproc) VERBOSE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-PS4
          path: "cmake-build/release/*"

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-Symbols-PS4
          path: "cmake-build/pplay"
          retention-days: 90

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "pPlay PS4" job.log
  ps5:
    needs: resolve-p2play
    runs-on: ubuntu-24.04
    env:
      P2PLAY_CORE_SHA: ${{ needs.resolve-p2play.outputs.core_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # pinned SDK (v0.41+: GPU OpenGL through Mesa), bump with a libplacebo/libmpv rebuild
      PS5_SDK_VERSION: v0.41.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt update || true
          sudo apt install -y bash clang-18 lld-18 build-essential \
            cmake python3-pip ninja-build pacman-package-manager \
            makepkg libarchive-tools zstd patch
          pip3 install meson --break-system-packages

          git clone -b ps5 https://github.com/freetushkan/libsmb2.git
          git clone --depth 1 https://github.com/freetushkan/pacbrew-repo.git /tmp/portlibs

          # Install PS5 Toolchain & Portlibs
          sudo mkdir -p /opt/ps5-payload-sdk
          wget -nv https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/${PS5_SDK_VERSION}/ps5-payload-dev.tar.gz
          sudo tar -xzf ps5-payload-dev.tar.gz -C /
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV

          # Setup pacman packages
          sudo mkdir -p /var/lib/pacman
          sudo pacman-key --init
          sudo pacman -Sy || true

      - name: Cache for build dependencies
        id: ps5-cache
        uses: actions/cache@v6
        with:
          path: /opt/compiled_libs
          key: ps5-${{ env.PS5_SDK_VERSION }}-v2

      - name: Build libplacebo
        if: steps.ps5-cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          set -eux
          mkdir -p /opt/compiled_libs/libplacebo
          cd /tmp/portlibs/libplacebo
          makepkg --nodeps --noconfirm --syncdeps --cleanbuild
          ls -l ./
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/libplacebo/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Build libmpv
        if: steps.ps5-cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          set -eux
          mkdir -p /opt/compiled_libs/libmpv
          cd /tmp/portlibs/libmpv
          makepkg --nodeps --noconfirm --syncdeps --cleanbuild
          ls -l ./
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/libmpv/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Install cached libs
        if: steps.ps5-cache.outputs.cache-hit == 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          find /opt/compiled_libs/libplacebo -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;
          find /opt/compiled_libs/libmpv -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Cache embedded P2Play Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.P2PLAY_BOOST_INCLUDE_DIR }}
          key: p2play-boost-${{ env.P2PLAY_BOOST_VERSION }}-${{ needs.resolve-p2play.outputs.core_sha }}-v1
      - name: Prepare embedded P2Play core
        run: ci/prepare-p2play-embedded.sh

      - name: Configure pPlay
        run: |
          exec > >(tee -a job.log) 2>&1
          rm -rf cmake-build
          mkdir cmake-build && cd cmake-build
          /opt/ps5-payload-sdk/bin/prospero-cmake \
            -DPLATFORM_PS5=ON \
            -DOPTION_SMB2=ON \
            -DPS5_PAYLOAD_SDK=/opt/ps5-payload-sdk \
            -DP2PLAY_EMBEDDED_SOURCE_DIR="$P2PLAY_EMBEDDED_SOURCE_DIR" \
            -DP2PLAY_EMBEDDED_BOOST_INCLUDE_DIR="$P2PLAY_EMBEDDED_BOOST_INCLUDE_DIR" \
            -DCMAKE_BUILD_TYPE=Release ..

      - name: Build pPlay
        run: |
          exec > >(tee -a job.log) 2>&1
          cd cmake-build
          make pplay_ps5_release pplay_loader -j$(nproc) VERBOSE=1
          # Preserve the exact unstripped payload ELF for crash.log address resolution.
          cp pplay.elf pplay.debug
          readelf -S pplay.debug | grep -q '\.debug_info'
          strip --strip-debug release/pplay/pplay.elf
          strip --strip-unneeded release/pplay/*.so*

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-Symbols-PS5
          path: "cmake-build/pplay.debug"
          retention-days: 90

      # the websrv / elfldr variant, the PKG one is pPlay-PS5
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-PS5_websrv
          path: "cmake-build/release/*"

      - name: Upload PKG input
        uses: actions/upload-artifact@v7
        with:
          name: ps5-pkg-input
          retention-days: 1
          path: |
            cmake-build/release/pplay
            cmake-build/pplay_loader.elf

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "pPlay PS5" job.log
  ps5-pkg:
    # PS5 PKG: PS4 package with the PS5 build (ps5/launcher, ps5/loader)
    needs: [ps5]
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt-get update || true
          sudo apt-get install -y pacman-package-manager libarchive-tools cmake make zstd

          sudo tee -a /etc/pacman.conf > /dev/null <<TEXT
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          TEXT

          sudo pacman --noconfirm -Sy
          sudo pacman --noconfirm -S --needed ps4-openorbis

      - name: Download PS5 build
        uses: actions/download-artifact@v8
        with:
          name: ps5-pkg-input
          path: ps5-input

      - name: Build PKG
        run: |
          exec > >(tee -a job.log) 2>&1
          set -eux
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          VERSION_MAJOR=$(sed -n 's/^set(VERSION_MAJOR "\(.*\)")/\1/p' CMakeLists.txt)
          VERSION_MINOR=$(sed -n 's/^set(VERSION_MINOR "\(.*\)")/\1/p' CMakeLists.txt)

          PKG_ROOT="${GITHUB_WORKSPACE}/pkgroot"
          rm -rf "${PKG_ROOT}" build-launcher release
          mkdir -p "${PKG_ROOT}/ps5" release
          cp -r data/ps4/romfs/sce_sys data/ps4/romfs/sce_module "${PKG_ROOT}/"
          cp -r ps5-input/release/pplay "${PKG_ROOT}/ps5/pplay"
          cp ps5-input/pplay_loader.elf "${PKG_ROOT}/ps5/"
          # the loader updates the files whose hash changed (see ps5/loader/loader.c)
          (cd "${PKG_ROOT}/ps5/pplay" && find . -type f | sed 's|^\./||' | LC_ALL=C sort | while read -r f; do
            echo "$(sha256sum "$f" | cut -c1-64) $(stat -c %s "$f") $f"; done > ../manifest && mv ../manifest .manifest)
          find "${PKG_ROOT}/ps5/pplay" -type f -size +1M ! -name '*.zst' -exec zstd -19 -T0 -q --rm {} \;
          find "${PKG_ROOT}" -type f | sort
          du -sh "${PKG_ROOT}"

          cmake -S ps5/launcher -B build-launcher \
            -DCMAKE_TOOLCHAIN_FILE=${OPENORBIS}/cmake/ps4.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPKG_DIR="${PKG_ROOT}" \
            -DPKG_VERSION="${VERSION_MAJOR}.${VERSION_MINOR}"
          cmake --build build-launcher --verbose
          cp build-launcher/*.pkg release/
          ls -lh release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-PS5
          path: "release/*.pkg"

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "pPlay PS5 package" job.log
  linux:
    needs: resolve-p2play
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    env:
      P2PLAY_CORE_SHA: ${{ needs.resolve-p2play.outputs.core_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DEBIAN_FRONTEND: noninteractive
      PPLAY_STATIC: /opt/pplay-static
    steps:
      - name: Create build environment
        run: |
          apt-get update
          apt-get install -y build-essential git cmake ninja-build nasm pkg-config patch curl file zip ca-certificates \
            python3-pip python3-jinja2 \
            zlib1g-dev libbz2-dev liblzma-dev libpng-dev libexpat1-dev libfontconfig-dev \
            libfreetype-dev libbrotli-dev uuid-dev libssl-dev libgl-dev libglm-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
          pip3 install meson==1.6.1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache for build dependencies
        id: linux-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PPLAY_STATIC }}
          key: linux-static-${{ hashFiles('ci/linux-static-deps.sh', 'ci/mpv-mkv-noindex-seek.patch') }}

      - name: Build static dependencies
        if: steps.linux-cache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a job.log) 2>&1
          WORK_DIR=/tmp/pplay-static-build ci/linux-static-deps.sh "$PPLAY_STATIC"

      - name: Cache embedded P2Play Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.P2PLAY_BOOST_INCLUDE_DIR }}
          key: p2play-boost-${{ env.P2PLAY_BOOST_VERSION }}-${{ needs.resolve-p2play.outputs.core_sha }}-v1
      - name: Prepare embedded P2Play core
        run: ci/prepare-p2play-embedded.sh

      - name: Configure pPlay
        run: |
          exec > >(tee -a job.log) 2>&1
          git clone -b master https://github.com/freetushkan/libsmb2.git
          rm -rf cmake-build
          mkdir -p cmake-build && cd cmake-build
          cmake -G "Unix Makefiles" \
            -DPLATFORM_LINUX=ON \
            -DOPTION_LINUX_STATIC=ON \
            -DLINUX_STATIC_PREFIX="$PPLAY_STATIC" \
            -DOPTION_SMB2=ON \
            -DP2PLAY_EMBEDDED_SOURCE_DIR="$P2PLAY_EMBEDDED_SOURCE_DIR" \
            -DP2PLAY_EMBEDDED_BOOST_INCLUDE_DIR="$P2PLAY_EMBEDDED_BOOST_INCLUDE_DIR" \
            -DCMAKE_BUILD_TYPE=Release ..

      - name: Build pPlay
        run: |
          exec > >(tee -a job.log) 2>&1
          cd cmake-build
          make pplay_linux_release -j$(nproc) VERBOSE=1
          # Keep a matching separate debug file; the AppImage remains compact.
          objcopy --only-keep-debug release/pplay/pplay pplay.debug
          strip --strip-debug release/pplay/pplay
          objcopy --add-gnu-debuglink=pplay.debug release/pplay/pplay
          ldd release/pplay/pplay || true

      - name: Build AppImage
        run: |
          exec > >(tee -a job.log) 2>&1
          ci/linux-appimage.sh cmake-build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-Linux
          path: "cmake-build/pPlay-x86_64.AppImage"

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-Symbols-Linux
          path: "cmake-build/pplay.debug"
          retention-days: 90

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "pPlay Linux" job.log
  android:
    needs: resolve-p2play
    runs-on: ubuntu-24.04
    env:
      P2PLAY_CORE_SHA: ${{ needs.resolve-p2play.outputs.core_sha }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # mpv-android's build scripts (ffmpeg, mpv, libass...), SDL2, libpng
      MPV_ANDROID_REV: 255901dd586fa750000fa0075f69d6ffdd26cd9c
      SDL_TAG: release-2.32.10
      PNG_TAG: v1.6.59
      GLM_TAG: 1.0.3

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      # Cache the Gradle wrapper and resolved Android Gradle Plugin/dependencies.
      # Seed branch-scoped caches for trusted PRs and pushes; fork PRs stay read-only.
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          cache-cleanup: always

      - name: Create build environment
        run: |
          exec > >(tee -a job.log) 2>&1
          sudo apt-get update || true
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm wget unzip patch
          sudo pip3 install meson --break-system-packages

          git clone https://github.com/mpv-android/mpv-android.git "$RUNNER_TEMP/mpv-android"
          git -C "$RUNNER_TEMP/mpv-android" checkout "$MPV_ANDROID_REV"
          git clone --depth 1 -b "$SDL_TAG" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          git clone --depth 1 -b "$PNG_TAG" https://github.com/pnggroup/libpng.git "$RUNNER_TEMP/libpng"
          git clone --depth 1 -b "$GLM_TAG" https://github.com/g-truc/glm.git "$RUNNER_TEMP/glm"

      - name: Cache for build dependencies
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/mpv-android/buildscripts/prefix
          key: android-prefix-${{ env.MPV_ANDROID_REV }}-${{ env.SDL_TAG }}-${{ env.PNG_TAG }}-v3

      - name: Cache embedded P2Play Boost headers
        uses: actions/cache@v6
        with:
          path: ${{ env.P2PLAY_BOOST_INCLUDE_DIR }}
          key: p2play-boost-${{ env.P2PLAY_BOOST_VERSION }}-${{ needs.resolve-p2play.outputs.core_sha }}-v1
      - name: Build pPlay
        env:
          # optional: a stable signing key (else the debug one of the runner, a new one each time)
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          exec > >(tee -a job.log) 2>&1
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pplay.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/pplay.keystore"
          fi
          ci/android-build.sh "$RUNNER_TEMP/mpv-android" "$RUNNER_TEMP/SDL" "$RUNNER_TEMP/libpng" "$RUNNER_TEMP/glm"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-Android
          path: "pPlay-Android.apk"

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: pPlay-Symbols-Android
          path: "symbols/*"
          retention-days: 90

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "pPlay Android" job.log
  publish:
    needs: [ps4, ps5, ps5-pkg, switch, linux, android]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pPlay-*
          path: ./artifacts

      # pPlay-<version>-<platform>.zip (Linux: the AppImage), the debug symbols of all in
      # pPlay-<version>-Symbols.zip, last
      - name: Pack release assets
        run: |
          exec > >(tee -a job.log) 2>&1
          set -eux
          VERSION="$(sed -n 's/^set(VERSION_MAJOR "\(.*\)")/\1/p' CMakeLists.txt).$(sed -n 's/^set(VERSION_MINOR "\(.*\)")/\1/p' CMakeLists.txt)"
          OUT="${GITHUB_WORKSPACE}/release-assets"
          rm -rf "$OUT" && mkdir -p "$OUT" symbols
          cp artifacts/pPlay-Linux/*.AppImage "$OUT/pPlay-${VERSION}-Linux-x86_64.AppImage"
          for platform in PS4 PS5 PS5_websrv Switch; do
            (cd "artifacts/pPlay-${platform}" && zip -r "$OUT/pPlay-${VERSION}-${platform}.zip" .)
          done
          # Android: when built (its job may fail)
          if [ -f artifacts/pPlay-Android/pPlay-Android.apk ]; then
            cp artifacts/pPlay-Android/pPlay-Android.apk "$OUT/pPlay-${VERSION}-Android.apk"
          fi
          for platform in Linux PS4 PS5 Switch Android; do
            if [ -d "artifacts/pPlay-Symbols-${platform}" ]; then
              cp -r "artifacts/pPlay-Symbols-${platform}" "symbols/${platform}"
            fi
          done
          (cd symbols && zip -r "$OUT/pPlay-${VERSION}-Symbols.zip" .)
          ls -lh "$OUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/pPlay-${{ env.VERSION }}-Linux-x86_64.AppImage
            ./release-assets/pPlay-${{ env.VERSION }}-Android.apk
            ./release-assets/pPlay-${{ env.VERSION }}-PS4.zip
            ./release-assets/pPlay-${{ env.VERSION }}-PS5.zip
            ./release-assets/pPlay-${{ env.VERSION }}-PS5_websrv.zip
            ./release-assets/pPlay-${{ env.VERSION }}-Switch.zip
            ./release-assets/pPlay-${{ env.VERSION }}-Symbols.zip

      - name: Build diagnostics summary
        if: always()
        run: bash ci/summarize-diagnostics.sh "pPlay release packaging" job.log

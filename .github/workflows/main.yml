name: ps4-release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ps4:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pacman-package-manager wget cmake git gettext smpq \
            makepkg libarchive-tools build-essential autoconf \
            libtool nasm curl pkg-config

          sudo tee -a /etc/pacman.conf > /dev/null <<TEXT
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          TEXT

          git clone --depth 1 https://github.com/PacBrew/ps4-openorbis-portlibs.git /tmp/portlibs

      - name: Setup pacman packages
        run: |
          sudo pacman --noconfirm -Sy
          sudo pacman --noconfirm -S --needed \
            ps4-openorbis ps4-openorbis-portlibs ps4-openorbis-libfmt

          # Fix missing header
          sudo mkdir -p /opt/pacbrew/ps4/openorbis/include/sys
          echo '#include <endian.h>' | sudo tee /opt/pacbrew/ps4/openorbis/include/sys/endian.h > /dev/null

      - name: Cache for recompiled PS4 Portlibs
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: /opt/compiled_libs
          key: ${{ runner.os }}-ps4-libs-v2

      - name: Build OpenSSL for PS4
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          cd ps4-openssl
          ./Configure --prefix=/opt/pacbrew/ps4/openorbis/usr ps4-cross no-tests no-shared
          find . -name "*.h" -exec sed -i 's/#define HAVE_GETENTROPY 1//g' {} +
          find . -name "*.h" -exec sed -i 's/#define HAVE_GETRANDOM 1//g' {} +
          sed -i 's/-DHAVE_GETENTROPY//g' Makefile
          sed -i 's/-DHAVE_GETRANDOM//g' Makefile
          make -j"$(nproc)"
          sudo make install
          find /opt -name openssl.pc
          mkdir -p /opt/compiled_libs/openssl
          cp -a /opt/pacbrew/ps4/openorbis/usr/include/openssl /opt/compiled_libs/openssl/ 2>/dev/null || true
          cp -a /opt/pacbrew/ps4/openorbis/usr/lib/libcrypto* /opt/compiled_libs/openssl/ 2>/dev/null || true
          cp -a /opt/pacbrew/ps4/openorbis/usr/lib/libssl* /opt/compiled_libs/openssl/ 2>/dev/null || true

      - name: Rebuild ffmpeg with mbedTLS and https
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p /opt/compiled_libs/ffmpeg
          cd /tmp/portlibs/ffmpeg
          sed -i "s/'ps4-openorbis-libfribidi' 'ps4-openorbis-freetype'/'ps4-openorbis-libfribidi' 'ps4-openorbis-freetype' 'ps4-openorbis-mbedtls'/" PKGBUILD
          sed -i 's/--enable-libfribidi/--enable-libfribidi --enable-version3 --enable-mbedtls/' PKGBUILD
          sed -i 's/--enable-protocol=file,http,ftp,tcp,udp,rtmp/--enable-protocol=file,http,ftp,tcp,udp,rtmp,https/' PKGBUILD
          grep -q 'ps4-openorbis-mbedtls' PKGBUILD
          grep -q 'enable-mbedtls' PKGBUILD
          grep -q 'udp,rtmp,https' PKGBUILD
          makepkg --noconfirm --syncdeps
          ls -l ./
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/ffmpeg/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Rebuild libmpv with updated ffmpeg
        if: steps.cache-libs.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p /opt/compiled_libs/libmpv
          cd /tmp/portlibs/libmpv
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          makepkg --noconfirm --syncdeps --cleanbuild
          ls -l ./
          find ./ -name "*.pkg.tar.*" -exec cp -v {} /opt/compiled_libs/libmpv/ \;
          find ./ -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Install cached OpenSSL
        if: steps.cache-libs.outputs.cache-hit == 'true'
        run: |
          echo "Restoring OpenSSL from cache..."
          sudo cp -a /opt/compiled_libs/openssl/include/openssl /opt/pacbrew/ps4/openorbis/usr/include/ 2>/dev/null || true
          sudo cp -a /opt/compiled_libs/openssl/lib* /opt/pacbrew/ps4/openorbis/usr/lib/ 2>/dev/null || true

      - name: Install cached ffmpeg
        if: steps.cache-libs.outputs.cache-hit == 'true'
        run: |
          find /opt/compiled_libs/ffmpeg -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Install cached libmpv
        if: steps.cache-libs.outputs.cache-hit == 'true'
        run: |
          find /opt/compiled_libs/libmpv -name "*.pkg.tar.*" -exec sudo pacman --noconfirm -U {} \;

      - name: Prepare OpenScreen
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"/openscreen

          echo "=== Patch C++20 related stuff ==="
          mkdir -p "CXX20_polyfills"
          cat > "CXX20_polyfills/format" <<'POLYFILL'
            #pragma once
            #ifndef __FORMAT_POLYFILL_H__
            #define __FORMAT_POLYFILL_H__
            #include <fmt/format.h>
            namespace std { using fmt::format; using fmt::format_string; }
            #endif
          POLYFILL
          touch "CXX20_polyfills/ranges"
          STRING_UTIL_H="util/string_util.h"
          if [ -f "$STRING_UTIL_H" ]; then
            sed -i 's/constexpr std::string/std::string/g' "$STRING_UTIL_H"
            sed -i 's/template <std::ranges::input_range R>/template <typename R>/g' "$STRING_UTIL_H"
            sed -i 's/std::ranges::empty/std::empty/g' "$STRING_UTIL_H"
            sed -i 's/return Join(std::ranges::subrange{begin, end}, delimeter);/return Join<Iterator>(begin, end, delimeter);/g' "$STRING_UTIL_H"
            sed -i 's/ss << range.front();/bool is_first = true;/g' "$STRING_UTIL_H"
            sed -i 's/for (auto element : range | std::views::drop(1))/for (auto\&\& element : range) if (is_first) is_first = false; else/g' "$STRING_UTIL_H"
            sed -i 's/ss << delimeter << element;/ss << (is_first ? "" : delimeter) << element; is_first = false;/g' "$STRING_UTIL_H"
          fi
          STRING_UTIL_CC="util/string_util.cc"
          if [ -f "$STRING_UTIL_CC" ]; then
            sed -i '/#include <ranges>/d' "$STRING_UTIL_CC"
            sed -i '/return std::ranges::equal(/,/);/c\  if (a.size() != b.size()) return false;\n  return std::equal(a.begin(), a.end(), b.begin(), [](char ch1, char ch2) { return ascii_tolower(ch1) == ascii_tolower(ch2); });' "$STRING_UTIL_CC"
            sed -i '/std::vector<std::string_view> Split/,/^}/c\std::vector<std::string_view> Split(std::string_view value, char delim) {\n  std::vector<std::string_view> result;\n  size_t start = 0, end = 0;\n  while ((end = value.find(delim, start)) != std::string_view::npos) {\n    if (end > start) result.emplace_back(value.substr(start, end - start));\n    start = end + 1;\n  }\n  if (start < value.size()) result.emplace_back(value.substr(start));\n  return result;\n}' "$STRING_UTIL_CC"
          fi
          RECEIVER_H="cast/streaming/public/receiver.h"
          if [ -f "$RECEIVER_H" ]; then
            sed -i '9i #include <optional>' "$RECEIVER_H"
            echo "Successfully added <optional> to receiver.h"
          fi
          ANY_INVOCABLE_INTERNAL_H="third_party/abseil/src/absl/functional/internal/any_invocable.h"
          if [ -f "$ANY_INVOCABLE_INTERNAL_H" ]; then
            echo "=== Patching internal any_invocable.h macro for C++17 ==="
            sed -i 's/ABSL_ASSERT(\[this\]() {/auto __absl_check = [this]() {/g' "$ANY_INVOCABLE_INTERNAL_H"
            sed -i 's/    }());/    }; ABSL_ASSERT(__absl_check());/g' "$ANY_INVOCABLE_INTERNAL_H"
          fi

          echo "=== Patching platform support check ==="
          CONFIG_FILE="build/build_config.h"
          cat << 'EOF' > ps4_config.h
            #if defined(__PS4__)
            #define OS_FREEBSD 1
            #define OS_BSD 1
            #define OS_POSIX 1
            #define COMPILER_GCC 1
            #define ARCH_CPU_X86_FAMILY 1
            #define ARCH_CPU_X86_64 1
            #define ARCH_CPU_64_BITS 1
            #define ARCH_CPU_LITTLE_ENDIAN 1
            #define BUILDFLAG_INTERNAL_IS_FREEBSD() (1)
            #define BUILDFLAG_INTERNAL_IS_BSD() (1)
            #define BUILDFLAG_INTERNAL_IS_POSIX() (1)
            #define BUILDFLAG_INTERNAL_IS_LINUX() (0)
            #define BUILDFLAG_INTERNAL_IS_WIN() (0)
            #endif
          EOF
          sed -i '/#define BUILD_BUILD_CONFIG_H_/r ps4_config.h' "$CONFIG_FILE"
          sed -i 's/#error Please add support for your platform in build\/build_config.h//g' "$CONFIG_FILE"
          sed -i 's/#error Please add support for your compiler in build\/build_config.h//g' "$CONFIG_FILE"
          rm -f ps4_config.h

          echo "=== Patching OpenScreen Crypto compatibility ==="
          CERT_FILE="util/crypto/certificate_utils.cc"
          if [ -f "$CERT_FILE" ]; then
            sed -i 's/ASN1_STRING_get0_data/ASN1_STRING_data/g' "$CERT_FILE"
            sed -i 's/ASN1_STRING_data(asn1int)/ASN1_STRING_data(const_cast<ASN1_INTEGER*>(asn1int))/g' "$CERT_FILE"
          fi
          SSL_UTIL_FILE="util/crypto/openssl_util.cc"
          if [ -f "$SSL_UTIL_FILE" ]; then
            sed -i 's/OPENSSL_init_ssl(OPENSSL_INIT_LOAD_SSL_STRINGS, nullptr) == 1/1 == 1/g' "$SSL_UTIL_FILE"
            sed -i 's/<< SSL_error_description(error_code);/<< "SSL Error Occurred";/g' "$SSL_UTIL_FILE"
          fi
          DIGEST_SIGN_FILE="util/crypto/digest_sign.cc"
          if [ -f "$DIGEST_SIGN_FILE" ]; then
            sed -i '/if (!EVP_DigestSignInit/,/^}/c\  if (!EVP_DigestSignInit(ctx.get(), nullptr, digest, nullptr, private_key)) { return Error::Code::kEVPInitializationError; } if (EVP_DigestSignUpdate(ctx.get(), data.data(), data.size()) != 1) { return Error::Code::kEVPInitializationError; } size_t sig_len = 0; if (EVP_DigestSignFinal(ctx.get(), nullptr, \&sig_len) != 1 || sig_len == 0) { return Error::Code::kEVPInitializationError; } std::string signature(sig_len, 0); if (EVP_DigestSignFinal(ctx.get(), reinterpret_cast<uint8_t*>(\&signature[0]), \&sig_len) != 1) { return Error::Code::kCreateSignatureFailed; } return signature; }' "$DIGEST_SIGN_FILE"
          fi

          echo "=== Generate Protobuf files ==="
          cd third_party/protobuf
          mkdir -p cmake/build_host
          cd cmake/build_host
          cmake -Dprotobuf_BUILD_TESTS=OFF -Dprotobuf_BUILD_EXAMPLES=OFF ../..
          make -j$(nproc) protoc libprotobuf-lite
          export PATH="$PWD:$PATH"
          cd "$GITHUB_WORKSPACE"/openscreen
          mkdir -p out/Default/gen
          for proto in \
            cast/common/channel/proto/cast_channel.proto \
            cast/common/channel/proto/authority_keys.proto \
            cast/streaming/remoting.proto \
            cast/streaming/input.proto \
            cast/streaming/rpc_messages.proto
          do
            protoc --proto_path=. --cpp_out=out/Default/gen $proto
          done

          echo "=== Verify generated files exist ==="
          for file in \
            runtime_version.h optimization.h value.h build_config.h \
            cast_channel.pb.h remoting.pb.h input.pb.h \
            json_value.cpp json_reader.cpp json_writer.cpp \
            logging_posix.cc arena.cc
          do 
            res=$(find . -name "$file")
            [ -n "$res" ] && echo "$res" || {
              echo "Warning: $file not found"
              exit 1
            }
          done

      - name: Configure pPlay
        run: |
          MAIN_CPP="src/main.cpp"
          IO_CPP="src/io.cpp"

          # libjbc
          if [ ! -d "src/libjbc" ]; then
            git clone https://github.com/sleirsgoevy/ps4-libjbc.git src/libjbc
          fi

          # FIX pid_t conflict
          sed -i 's/typedef uint32_t pid_t;/\/\/ typedef uint32_t pid_t;/g' src/libjbc/defs.h

          # Inject libjbc
          if ! grep -q "libjbc/jailbreak.c" CMakeLists.txt; then
            echo 'target_sources(pplay PRIVATE src/libjbc/jailbreak.c src/libjbc/kernelrw.c src/libjbc/utils.c)' >> CMakeLists.txt
            echo 'target_include_directories(pplay PRIVATE src)' >> CMakeLists.txt
          fi

          # Patch paths
          if [ -f "$IO_CPP" ]; then
            sed -i 's|return "/data/";|return "/mnt/disc/";|g' "$IO_CPP"
            sed -i 's|devices.push_back({"/data/", "DATA", DeviceType::HDD});|devices.push_back({"/mnt/disc/", "NAPED BD", DeviceType::USB});|g' "$IO_CPP"
          fi

          # Build
          rm -rf cmake-build
          mkdir -p pscrap && echo "test" > pscrap/tmdb.key

          mkdir -p cmake-build
          cd cmake-build

          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          export OPENORBIS=/opt/pacbrew/ps4/openorbis

          cmake -G "Unix Makefiles" \
            -DPLATFORM_PS4=ON \
            -DOPTION_SMB2=ON \
            -DOPENSCREEN_ROOT="${GITHUB_WORKSPACE}/openscreen" \
            -DOPENORBIS_ROOT="/opt/pacbrew/ps4/openorbis" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_AR="${AR}" ..

      - name: Build pplay
        run: |
          source /opt/pacbrew/ps4/openorbis/ps4vars.sh
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          cd cmake-build
          make pplay_pkg -j$(nproc) VERBOSE=1
          mv *.pkg ../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pPlay-PS4-PKG
          path: "*.pkg"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: "*.pkg"

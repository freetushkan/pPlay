// the native libraries and the assets come from ci/android-build.sh (app/src/main/jniLibs, assets)
buildscript {
    repositories {
        // AGP and Android tooling are published to Google's Maven repository.
        // Try it before Maven Central to avoid unnecessary Central requests/429s.
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

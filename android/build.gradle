// the native libraries and the assets come from ci/android-build.sh (app/src/main/jniLibs, assets)
buildscript {
    repositories {
        // AGP and Android tooling are published to Google's Maven repository.
        google()
        // Google-hosted Maven Central mirror reduces 429s on shared CI egress.
        maven {
            name = 'GoogleMavenCentralMirror'
            url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
        }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

allprojects {
    repositories {
        google()
        maven {
            name = 'GoogleMavenCentralMirror'
            url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
        }
        mavenCentral()
    }
}
